[project]
name = "motionlab"
version = "0.1.0"
description = "Positional balance in competitive debating motions, adjusted for team strength"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
