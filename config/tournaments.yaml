# MotionLab tournament registry.
#
# Two accepted row shapes:
#
#   base_url + optional slug        - slug is discovered from the API if omitted
#   url                             - a single tab-site URL; base and slug are split out
#
# Then:
#   python scripts/probe_api.py --config config/tournaments.yaml   # what is readable
#   python scripts/ingest_all.py                                   # API where possible, else pages
#
# Ingestion picks its adapter per tournament. The REST API is a per-tournament
# setting most organisers never switch on, so most rows will come through the
# public results pages instead -- which is also about eighty times cheaper in
# requests. Force one with --source api / --source pages.
#
# FINDING MORE TOURNAMENTS
# The BP Debate Directory project maintains a public spreadsheet of BP tab sites
# with team counts and round counts, so you can prioritise the large ones:
#   https://docs.google.com/spreadsheets/d/167zz_2rI83PXN_oZkIG5fuvVuKxnVtuNL6v0F_8hKJE
# Prefer tournaments with many rooms: a motion run in 90 rooms is measured far
# better than one run in 6, and the evidence label on the site says so.

tournaments:
  - name: wudc_2022
    title: WUDC Belgrade 2022
    base_url: https://wudc2022.calicotab.com
    slug: wudc
    format: bp
    year: 2022

  - name: abpdc_2024
    title: Australian BP Debating Championships 2024
    base_url: https://abpdc2024.calicotab.com
    format: bp
    year: 2024

  - name: enbp_2024
    title: Enchiridion British Parliamentary 2024
    base_url: https://enbp2024.calicotab.com
    format: bp
    year: 2024

  - name: bbpc_2024
    title: Borneo BP Championship 2024
    base_url: https://unimasdebates.calicotab.com
    format: bp
    year: 2024

  - name: berkeley_iv_2024
    title: Berkeley IV 2024
    base_url: https://berkeleyiv2024.calicotab.com
    format: bp
    year: 2024

  # Example of the single-URL shape, which is what the spreadsheet publishes:
