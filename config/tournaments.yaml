# MotionLab tournament registry.
#
# One entry per public Tabbycat instance. `slug` is optional — the probe
# discovers it from the API when omitted. Run:
#
#     python scripts/probe_api.py --config config/tournaments.yaml
#
# and keep only the entries that come back USABLE.
#
# Finding more instances: https://debatedirectory.com/tournaments lists ~1,100
# BP tournaments. Most link to their tab site; the tab site's host is the
# base_url here.

tournaments:
  - name: wudc_2022
    title: WUDC Belgrade 2022
    base_url: https://wudc2022.calicotab.com
    slug: wudc
    format: bp
    year: 2022

  - name: abpdc_2024
    title: Australian BP Debating Championships 2024
    base_url: https://abpdc2024.calicotab.com
    format: bp
    year: 2024

  - name: enbp_2024
    title: Enchiridion British Parliamentary 2024
    base_url: https://enbp2024.calicotab.com
    format: bp
    year: 2024

  - name: bbpc_2024
    title: Borneo BP Championship 2024
    base_url: https://unimasdebates.calicotab.com
    format: bp
    year: 2024

  - name: berkeley_iv_2024
    title: Berkeley IV 2024
    base_url: https://berkeleyiv2024.calicotab.com
    format: bp
    year: 2024
